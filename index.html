<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Котик 🐱</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --cat-fur: #FFAB4A;
      --cat-shadow: #E8933A;
      --cat-outline: #5E4433;
      --bg: #FFF8EF;
      --cream: #FFF2E0;
      --accent: #FF7B54;
      --muted: #C8A07A;
      --text: #3D2B1F;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Floating paws background */
    .bg-deco {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }
    .paw {
      position: absolute;
      font-size: clamp(1rem, 3vw, 2rem);
      opacity: 0.07;
      animation: floatPaw linear infinite;
      user-select: none;
    }
    @keyframes floatPaw {
      0%   { transform: translateY(110vh) rotate(0deg); }
      100% { transform: translateY(-10vh) rotate(360deg); }
    }

    /* Hero */
    .hero {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
      text-align: center;
    }

    .card {
      background: white;
      border-radius: 2.5rem;
      padding: 3.5rem 4rem;
      max-width: 480px;
      width: 100%;
      box-shadow:
        0 2px 0 #E8C08A,
        0 6px 0 #D4A870,
        0 14px 40px rgba(93,68,51,.12);
      position: relative;
    }

    .card::before {
      content: '';
      position: absolute;
      top: -18px; left: 50%; transform: translateX(-50%);
      width: 90%; height: 18px;
      background: var(--cream);
      border-radius: 1rem 1rem 0 0;
      border: 3px solid #E8C08A;
      border-bottom: none;
    }

    /* Cat SVG enlarged & centered */
    .cat-wrap {
      display: inline-block;
      position: relative;
      margin-bottom: 1.5rem;
      filter: drop-shadow(0 8px 20px rgba(255,171,74,.35));
      transition: transform .3s;
      cursor: pointer;
    }
    .cat-wrap:hover {
      transform: scale(1.08) translateY(-4px);
    }
    .cat-wrap svg {
      width: 140px;
      height: 140px;
    }

    h1 {
      font-family: 'Baloo 2', cursive;
      font-size: 2.4rem;
      font-weight: 800;
      color: var(--cat-outline);
      line-height: 1.1;
      margin-bottom: .6rem;
    }
    h1 span { color: var(--accent); }

    .tagline {
      font-size: 1.05rem;
      color: var(--muted);
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    /* Mood meter */
    .mood-section {
      background: var(--cream);
      border-radius: 1.5rem;
      padding: 1.2rem 1.5rem;
      margin-bottom: 1.8rem;
      text-align: left;
    }
    .mood-label {
      font-family: 'Baloo 2', cursive;
      font-weight: 600;
      font-size: .85rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .08em;
      margin-bottom: .6rem;
    }
    .moods {
      display: flex;
      gap: .5rem;
      flex-wrap: wrap;
    }
    .mood-btn {
      background: white;
      border: 2px solid #E8C08A;
      border-radius: 2rem;
      padding: .35rem .9rem;
      font-size: .9rem;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Nunito', sans-serif;
      font-weight: 600;
    }
    .mood-btn:hover, .mood-btn.active {
      background: var(--cat-fur);
      border-color: var(--cat-fur);
      color: white;
      transform: scale(1.06);
    }

    /* Response bubble */
    .bubble {
      background: var(--cream);
      border: 2px solid #E8C08A;
      border-radius: 1.2rem;
      padding: 1rem 1.4rem;
      font-size: .95rem;
      line-height: 1.5;
      min-height: 3.5rem;
      text-align: left;
      color: var(--text);
      transition: all .3s;
      position: relative;
    }
    .bubble::before {
      content: '🐾';
      position: absolute;
      top: -1px; left: 12px;
      font-size: .75rem;
      transform: translateY(-50%);
      background: var(--cream);
      padding: 0 4px;
    }

    /* Pet counter */
    .pet-area {
      margin-top: 1.6rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .pet-btn {
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 1rem;
      padding: .65rem 1.4rem;
      font-family: 'Baloo 2', cursive;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      box-shadow: 0 4px 0 #C85A30;
      transition: all .15s;
    }
    .pet-btn:active {
      transform: translateY(3px);
      box-shadow: 0 1px 0 #C85A30;
    }
    .counter {
      font-family: 'Baloo 2', cursive;
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--cat-outline);
    }
    .counter span {
      color: var(--accent);
      font-size: 1.4rem;
    }

    /* Floating hearts */
    .heart {
      position: fixed;
      pointer-events: none;
      font-size: 1.4rem;
      z-index: 999;
      animation: heartFloat 1.2s ease-out forwards;
    }
    @keyframes heartFloat {
      0%   { opacity: 1; transform: translateY(0) scale(1); }
      100% { opacity: 0; transform: translateY(-90px) scale(1.6); }
    }
  </style>
</head>
<body>

<!-- Background paws -->
<div class="bg-deco" id="bgDeco"></div>

<div class="hero">
  <div class="card">

    <!-- The SVG Cat -->
    <div class="cat-wrap" id="catWrap" title="Нажми на меня!">
      <svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
        <style>
          :root { --cat-fur:#FFAB4A; --cat-shadow:#E8933A; --cat-outline:#5E4433; }
          .outline { stroke:var(--cat-outline); stroke-width:4; stroke-linecap:round; stroke-linejoin:round; }
          .tail-group { transform-origin:50% 75%; animation:tailWag 2.5s infinite ease-in-out alternate; }
          @keyframes tailWag { 0%{transform:rotate(-20deg)} 100%{transform:rotate(20deg)} }
          .ears-group { transform-origin:50% 40%; animation:earTwitch 5s infinite ease-in-out; }
          @keyframes earTwitch {
            0%,85%,100%{transform:rotate(0deg) scale(1)}
            90%{transform:rotate(-3deg) scale(1.02)}
            95%{transform:rotate(3deg) scale(1.02)}
          }
        </style>
        <g class="tail-group">
          <path class="outline" d="M50 75C50 75 30 70 25 55C20 40 35 30 45 35" stroke="var(--cat-outline)" stroke-width="4"/>
          <path d="M50 75C50 75 30 70 25 55C20 40 35 30 45 35" fill="var(--cat-shadow)"/>
        </g>
        <g class="body-group">
          <path class="outline" d="M30 85H70C78 85 85 78 85 70V55C85 40 75 30 50 30C25 30 15 40 15 55V70C15 78 22 85 30 85Z" fill="var(--cat-fur)"/>
          <g class="ears-group">
            <path class="outline" d="M35 32L25 15L45 28" fill="var(--cat-fur)"/>
            <path class="outline" d="M65 32L75 15L55 28" fill="var(--cat-fur)"/>
          </g>
          <path class="outline" d="M40 85V75" stroke-width="3" opacity="0.6"/>
          <path class="outline" d="M60 85V75" stroke-width="3" opacity="0.6"/>
        </g>
      </svg>
    </div>

    <h1>Привет, я <span>Котик!</span></h1>
    <p class="tagline">Маленький рыжий кот с большим хвостом и подвижными ушами.<br>Скажи, как ты себя чувствуешь — я отвечу!</p>

    <!-- Mood selector -->
    <div class="mood-section">
      <div class="mood-label">Как ты сегодня?</div>
      <div class="moods">
        <button class="mood-btn" data-mood="happy">😄 Отлично</button>
        <button class="mood-btn" data-mood="tired">😪 Устал</button>
        <button class="mood-btn" data-mood="sad">😢 Грустно</button>
        <button class="mood-btn" data-mood="hungry">🍕 Голоден</button>
        <button class="mood-btn" data-mood="cozy">🛋️ Уютно</button>
      </div>
    </div>

    <div class="bubble" id="bubble">Выбери настроение, и я скажу кое-что важное…</div>

    <!-- Pet counter -->
    <div class="pet-area">
      <button class="pet-btn" id="petBtn">🐾 Погладить</button>
      <div class="counter">Погладили: <span id="petCount">0</span> раз</div>
    </div>

  </div>
</div>

<script>
  // Background paws
  const deco = document.getElementById('bgDeco');
  for (let i = 0; i < 18; i++) {
    const p = document.createElement('div');
    p.className = 'paw';
    p.textContent = ['🐾','🐾','🐱','✨'][Math.floor(Math.random()*4)];
    p.style.left = Math.random()*100 + 'vw';
    p.style.animationDuration = (8 + Math.random()*12) + 's';
    p.style.animationDelay = (Math.random()*12) + 's';
    p.style.fontSize = (1 + Math.random()*2) + 'rem';
    deco.appendChild(p);
  }

  // Mood responses
  const responses = {
    happy:  '😸 Мяу! Это восхитительно! Твоя радость заряжает меня энергией. Урр-урр~',
    tired:  '😿 Ох, бедняжка… Иди ложись, я приду и устроюсь у тебя на ногах. Тепло гарантировано.',
    sad:    '🤗 Мяу-мяу… Я иду к тебе! Котики умеют лечить грусть — просто позволь мне помурчать рядом.',
    hungry: '😹 Ха! Я тоже! Давай вместе найдём что-нибудь вкусное. Рыба — лучший вариант, уж поверь.',
    cozy:   '😻 Уютно — моё любимое состояние. Давай завернёмся в плед и будем смотреть в окно на дождь?'
  };

  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const bubble = document.getElementById('bubble');
      bubble.style.opacity = '0';
      setTimeout(() => {
        bubble.textContent = responses[btn.dataset.mood];
        bubble.style.opacity = '1';
        bubble.style.transition = 'opacity .35s';
      }, 200);
    });
  });

  // Pet counter + hearts
  let count = 0;
  document.getElementById('petBtn').addEventListener('click', (e) => {
    count++;
    document.getElementById('petCount').textContent = count;
    spawnHearts(e.clientX, e.clientY);
  });

  document.getElementById('catWrap').addEventListener('click', (e) => {
    count++;
    document.getElementById('petCount').textContent = count;
    const r = e.currentTarget.getBoundingClientRect();
    spawnHearts(r.left + r.width/2, r.top + r.height/2);
  });

  function spawnHearts(x, y) {
    const emojis = ['❤️','🧡','💛','🐾','✨'];
    for (let i = 0; i < 5; i++) {
      const h = document.createElement('div');
      h.className = 'heart';
      h.textContent = emojis[Math.floor(Math.random()*emojis.length)];
      h.style.left = (x + (Math.random()-0.5)*60) + 'px';
      h.style.top  = (y + (Math.random()-0.5)*30) + 'px';
      h.style.animationDelay = (Math.random()*.3) + 's';
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 1500);
    }
  }
</script>
</body>
</html>
