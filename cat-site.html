<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Рыжик 🐱</title>
  <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;600;800&family=Nunito:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg:      #0F0C0A;
      --surface: #1A1512;
      --card:    #211C18;
      --border:  #3A2F27;
      --orange:  #FFB347;
      --orange2: #FF8C00;
      --rust:    #D85010;
      --muted:   #7A6558;
      --text:    #F0E6D8;
      --subtle:  #A08878;
    }
    * { margin:0; padding:0; box-sizing:border-box; }

    body {
      background: var(--bg);
      font-family: 'Nunito', sans-serif;
      color: var(--text);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      overflow-x: hidden;
    }

    /* Ambient glow */
    body::before {
      content: '';
      position: fixed;
      top: 35%; left: 50%;
      transform: translate(-50%,-50%);
      width: 700px; height: 500px;
      background: radial-gradient(ellipse, rgba(255,139,0,.07) 0%, transparent 65%);
      pointer-events: none;
    }

    /* Floating sparks */
    .sparks { position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:0; }
    .spark {
      position: absolute;
      border-radius: 50%;
      background: var(--orange);
      opacity: 0;
      animation: sparkFloat linear infinite;
    }
    @keyframes sparkFloat {
      0%   { opacity:0; transform:translateY(110vh) scale(0); }
      8%   { opacity:.35; }
      92%  { opacity:.1; }
      100% { opacity:0; transform:translateY(-10vh) scale(1); }
    }

    /* Two-column layout */
    .layout {
      display: grid;
      grid-template-columns: 220px 1fr;
      gap: 1.2rem;
      max-width: 800px;
      width: 100%;
      position: relative;
      z-index: 1;
    }

    /* LEFT PANEL */
    .left {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: 2rem 1.5rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04), 0 0 50px rgba(255,139,0,.05);
    }

    .cat-wrap {
      cursor: pointer;
      filter: drop-shadow(0 0 20px rgba(255,179,71,.22));
      transition: filter .3s, transform .3s;
      user-select: none;
    }
    .cat-wrap:hover  { filter:drop-shadow(0 0 36px rgba(255,179,71,.55)); transform:translateY(-5px) scale(1.05); }
    .cat-wrap:active { transform:scale(.95); }

    .cat-name {
      font-family: 'Baloo 2', cursive;
      font-size: 1.6rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--orange), var(--rust));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .cat-desc {
      text-align: center;
      color: var(--muted);
      font-size: .8rem;
      line-height: 1.6;
    }

    /* Mini stats */
    .mini-stats {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: .45rem;
    }
    .mini-stat {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: .9rem;
      padding: .45rem .85rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: .8rem;
    }
    .mini-stat .ms-label { color: var(--muted); }
    .mini-stat .ms-val {
      font-family: 'Baloo 2', cursive;
      font-weight: 700;
      color: var(--orange);
    }

    /* Pet button */
    .pet-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--orange), var(--rust));
      border: none;
      border-radius: 1.1rem;
      padding: .7rem;
      font-family: 'Baloo 2', cursive;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      box-shadow: 0 4px 18px rgba(255,139,0,.28);
      transition: all .2s;
    }
    .pet-btn:hover  { transform:translateY(-2px); box-shadow:0 8px 26px rgba(255,139,0,.45); }
    .pet-btn:active { transform:scale(.97); }

    /* RIGHT PANEL */
    .right {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 1.6rem;
      padding: 1.3rem 1.5rem;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.04);
    }

    .card-title {
      font-family: 'Baloo 2', cursive;
      font-size: .7rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: .1em;
      margin-bottom: .85rem;
    }

    /* 2×2 action grid */
    .actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: .6rem;
    }
    .act-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 1rem;
      padding: .85rem .6rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .3rem;
      cursor: pointer;
      transition: all .2s;
      font-family: 'Nunito', sans-serif;
    }
    .act-btn .ico  { font-size: 1.5rem; }
    .act-btn .lbl  { font-size: .78rem; font-weight: 600; color: var(--muted); }
    .act-btn:hover { background:rgba(255,179,71,.07); border-color:rgba(255,179,71,.4); transform:translateY(-2px); }
    .act-btn:hover .lbl { color:var(--orange); }
    .act-btn:active { transform:scale(.97); }

    /* Mood pills */
    .moods {
      display: flex;
      gap: .45rem;
      flex-wrap: wrap;
    }
    .mood-btn {
      background: var(--surface);
      border: 1.5px solid var(--border);
      border-radius: 2rem;
      padding: .38rem .9rem;
      font-size: .82rem;
      font-weight: 600;
      font-family: 'Nunito', sans-serif;
      color: var(--subtle);
      cursor: pointer;
      transition: all .2s;
    }
    .mood-btn:hover { border-color:var(--orange); color:var(--orange); }
    .mood-btn.active {
      background: linear-gradient(135deg,var(--orange2),var(--rust));
      border-color: transparent;
      color: white;
    }

    /* Bubble */
    .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 1.1rem;
      padding: .9rem 1.1rem;
      font-size: .88rem;
      line-height: 1.65;
      color: var(--muted);
      min-height: 3.4rem;
      transition: opacity .25s;
      font-style: italic;
    }
    .bubble.lit { color: var(--text); font-style: normal; }

    /* Floating emojis */
    .floaty {
      position: fixed;
      pointer-events: none;
      font-size: 1.3rem;
      z-index: 999;
      animation: floatUp 1.1s ease-out forwards;
    }
    @keyframes floatUp {
      0%   { opacity:1; transform:translateY(0) scale(.7); }
      100% { opacity:0; transform:translateY(-85px) scale(1.7) rotate(15deg); }
    }

    /* Toast */
    .toast {
      position: fixed;
      bottom: 1.8rem; left:50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 2rem;
      padding: .5rem 1.3rem;
      font-size: .83rem;
      color: var(--orange);
      opacity: 0;
      pointer-events: none;
      transition: all .3s;
      white-space: nowrap;
      z-index: 100;
    }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    @media (max-width:580px) {
      .layout { grid-template-columns:1fr; }
      .left { flex-direction:row; flex-wrap:wrap; justify-content:center; border-radius:1.5rem; }
      .mini-stats,.pet-btn { width:100%; }
    }
  </style>
</head>
<body>

<div class="sparks" id="sparks"></div>

<div class="layout">

  <!-- LEFT -->
  <div class="left">
    <div class="cat-wrap" id="catWrap">
      <svg width="180" height="180" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <style>
          .tail  { transform-origin:45px 75px; animation:tailWag 3s infinite ease-in-out alternate; }
          @keyframes tailWag { from{transform:rotate(-15deg)} to{transform:rotate(25deg)} }
          .ear-l { transform-origin:35px 35px; animation:earTwitch 4s infinite; }
          .ear-r { transform-origin:65px 35px; animation:earTwitch 5s infinite 1s; }
          @keyframes earTwitch {
            0%,90%,100%{transform:rotate(0)}
            92%,96%{transform:rotate(-5deg) scale(1.05)}
            94%{transform:rotate(5deg)}
          }
          .eye { animation:blink 4s infinite; transform-origin:center; }
          @keyframes blink {
            0%,96%,100%{transform:scaleY(1)}
            98%{transform:scaleY(0)}
          }
          .whiskers { animation:whiskerMove 6s infinite ease-in-out; }
          @keyframes whiskerMove {
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(1px) rotate(1deg)}
          }
          .body-group { animation:breath 4s infinite ease-in-out; transform-origin:50% 85%; }
          @keyframes breath {
            0%,100%{transform:scale(1)}
            50%{transform:scale(1.02,.98)}
          }
          .paw-l { animation:pawStep 2s infinite ease-in-out; }
          .paw-r { animation:pawStep 2s infinite ease-in-out 1s; }
          @keyframes pawStep {
            0%,100%{transform:translateY(0)}
            50%{transform:translateY(-2px)}
          }
        </style>
        <defs>
          <linearGradient id="cg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#FFB347"/>
            <stop offset="100%" stop-color="#FF8C00"/>
          </linearGradient>
        </defs>
        <path class="tail" d="M45 75 C 30 75,20 60,25 45 C 28 35,40 35,42 45" stroke="#5E4433" stroke-width="6" fill="none" stroke-linecap="round"/>
        <g class="body-group">
          <path class="ear-l" d="M30 40 L25 20 L45 35 Z" fill="#FFB347" stroke="#5E4433" stroke-width="3" stroke-linejoin="round"/>
          <path class="ear-r" d="M70 40 L75 20 L55 35 Z" fill="#FFB347" stroke="#5E4433" stroke-width="3" stroke-linejoin="round"/>
          <path d="M30 85 Q 20 85 20 70 Q 20 40 50 40 Q 80 40 80 70 Q 80 85 70 85 Z" fill="url(#cg)" stroke="#5E4433" stroke-width="3"/>
          <circle class="eye" cx="40" cy="55" r="2.5" fill="#5E4433"/>
          <circle class="eye" cx="60" cy="55" r="2.5" fill="#5E4433"/>
          <path d="M48 62 Q 50 65 52 62" stroke="#5E4433" stroke-width="2" fill="none" stroke-linecap="round"/>
          <g class="whiskers" stroke="#5E4433" stroke-width="1" opacity="0.7">
            <line x1="30" y1="60" x2="15" y2="58"/>
            <line x1="30" y1="63" x2="15" y2="65"/>
            <line x1="70" y1="60" x2="85" y2="58"/>
            <line x1="70" y1="63" x2="85" y2="65"/>
          </g>
          <rect class="paw-l" x="35" y="82" width="10" height="6" rx="3" fill="#FFD194" stroke="#5E4433" stroke-width="2"/>
          <rect class="paw-r" x="55" y="82" width="10" height="6" rx="3" fill="#FFD194" stroke="#5E4433" stroke-width="2"/>
        </g>
      </svg>
    </div>

    <div class="cat-name">Рыжик</div>
    <div class="cat-desc">Уютный рыжий кот. Любит рыбу, тёплые пледы и ночные прогулки по подоконнику.</div>

    <div class="mini-stats">
      <div class="mini-stat"><span class="ms-label">🐾 Погладили</span><span class="ms-val" id="countLeft">0</span></div>
      <div class="mini-stat"><span class="ms-label">💛 Настроение</span><span class="ms-val" id="moodLeft">—</span></div>
      <div class="mini-stat"><span class="ms-label">⭐ Действие</span><span class="ms-val" id="actionLeft">—</span></div>
    </div>

    <button class="pet-btn" id="petBtn">🐾 Погладить</button>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="card">
      <div class="card-title">Действия</div>
      <div class="actions">
        <button class="act-btn" data-action="feed">  <span class="ico">🐟</span><span class="lbl">Покормить</span></button>
        <button class="act-btn" data-action="play">  <span class="ico">🧶</span><span class="lbl">Поиграть</span></button>
        <button class="act-btn" data-action="sleep"> <span class="ico">🛋️</span><span class="lbl">Уложить спать</span></button>
        <button class="act-btn" data-action="purr">  <span class="ico">🎵</span><span class="lbl">Помурчать</span></button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Как ты себя чувствуешь?</div>
      <div class="moods">
        <button class="mood-btn" data-mood="happy"  data-icon="😄">Отлично</button>
        <button class="mood-btn" data-mood="tired"  data-icon="😪">Устал</button>
        <button class="mood-btn" data-mood="sad"    data-icon="😢">Грустно</button>
        <button class="mood-btn" data-mood="hungry" data-icon="🍕">Голоден</button>
        <button class="mood-btn" data-mood="cozy"   data-icon="✨">Уютно</button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Рыжик говорит</div>
      <div class="bubble" id="bubble">Нажми на действие или погладь меня…</div>
    </div>

  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // Sparks
  const sc = document.getElementById('sparks');
  for (let i = 0; i < 20; i++) {
    const s = document.createElement('div');
    s.className = 'spark';
    const sz = 2 + Math.random()*3;
    s.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.random()*100}vw;animation-duration:${12+Math.random()*14}s;animation-delay:${Math.random()*14}s`;
    sc.appendChild(s);
  }

  let pets = 0;

  function setBubble(txt) {
    const b = document.getElementById('bubble');
    b.style.opacity = '0';
    setTimeout(() => { b.textContent = txt; b.classList.add('lit'); b.style.opacity='1'; }, 220);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(t._timer);
    t._timer = setTimeout(() => t.classList.remove('show'), 2200);
  }

  function spawnFloaty(x, y, set) {
    for (let i = 0; i < 5; i++) {
      const el = document.createElement('div');
      el.className = 'floaty';
      el.textContent = set[Math.floor(Math.random()*set.length)];
      el.style.left = (x + (Math.random()-.5)*70) + 'px';
      el.style.top  = (y + (Math.random()-.5)*30) + 'px';
      el.style.animationDelay = Math.random()*.22 + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1400);
    }
  }

  // Pet
  function doPet(x, y) {
    pets++;
    document.getElementById('countLeft').textContent = pets;
    spawnFloaty(x, y, ['🧡','❤️','🐾','✨','💛','🔥']);
    const lines = ['Мурр… мне нравится 🧡','Ещё! Пожалуйста~','Урр-урр… тепло…','Мяу! Ты лучший 🐾','Пур-пур… не останавливайся…'];
    setBubble(lines[Math.floor(Math.random()*lines.length)]);
  }

  document.getElementById('petBtn').addEventListener('click', e => doPet(e.clientX, e.clientY));
  document.getElementById('catWrap').addEventListener('click', e => {
    doPet(e.clientX, e.clientY);
    showToast('Рыжик доволен! 🐱');
  });

  // Actions
  const actionData = {
    feed:  { icon:'🐟', label:'Сытый',  sparks:['🐟','✨','💛'], texts:['Рыба! РЫБА! Это лучший день! 🐟','Ммм… так вкусно. Ты заботишься обо мне~','Мяу! Я сыт и очень счастлив 🍽️'] },
    play:  { icon:'🧶', label:'Игривый', sparks:['🧶','⚡','✨'], texts:['Нитка! Дай-дай-дай! Поймал! 🧶','Я самый быстрый кот на диване!','Ах, это так весело! Ещё раз, ещё 🎉'] },
    sleep: { icon:'💤', label:'Сонный',  sparks:['💤','🌙','⭐'], texts:['Zzz… тепло… мур… 💤','Я уже сплю. Не трогай. Мур. 😴','Сон — это искусство, и я в нём мастер 🛋️'] },
    purr:  { icon:'🎵', label:'Мурчит',  sparks:['🎵','💜','✨'], texts:['Мурр-мурр… чувствуешь вибрацию? Это лечит 🎵','Пур-пур-пур… включаю режим котерапии~','Урр-урр… мурчание запущено. Расслабься 🎶'] }
  };

  document.querySelectorAll('.act-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      const d = actionData[btn.dataset.action];
      document.getElementById('actionLeft').textContent = d.icon + ' ' + d.label;
      setBubble(d.texts[Math.floor(Math.random()*d.texts.length)]);
      const r = btn.getBoundingClientRect();
      spawnFloaty(r.left+r.width/2, r.top, d.sparks);
    });
  });

  // Moods
  const moodTexts = {
    happy:  'Отличное настроение? Мур-р! Давай порезвимся вместе 🎉',
    tired:  'Устал? Иди ляг, я приду и урчу тебя в сон. Обещаю 🌙',
    sad:    'Не грусти… я тут. Тихо мурчу и смотрю на тебя добрыми глазами 🧡',
    hungry: 'Голодный? Я тоже! Рыба сейчас была бы очень кстати…',
    cozy:   'Уютно — моё любимое слово. Плед, темнота и тихое мурчание ✨'
  };

  document.querySelectorAll('.mood-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mood-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('moodLeft').textContent = btn.dataset.icon;
      setBubble(moodTexts[btn.dataset.mood]);
    });
  });
</script>
</body>
</html>
